<!doctype html>
<html lang="my">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whisper Of Words — Book Review Terminal</title>
    <meta name="description" content="Whisper Of Words Mmepub — မြန်မာစာအုပ်စာအညွှန်းများ စုစည်းမှု။ Free Myanmar book reviews & recommendations." />
    <meta property="og:title" content="Whisper Of Words — Book Review Terminal" />
    <meta property="og:description" content="မြန်မာစာအုပ်စာအညွှန်းများ စုစည်းမှု — Free Myanmar book reviews & recommendations." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Whisper Of Words" />
    <meta property="og:url" content="https://whisperofwords-review.pages.dev/" />
    <meta property="og:image" content="https://whisperofwords-review.pages.dev/assets/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Whisper Of Words — Book Review Terminal" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" /></noscript>
    <link rel="stylesheet" href="styles.css" />
    <script>
      (function () {
        if (window.__WOW_READY__) return;
        setTimeout(function () {
          if (window.__WOW_READY__) return;
          var boot = document.getElementById("boot");
          var fb = document.getElementById("static-fallback");
          if (boot) boot.remove();
          if (fb) fb.style.display = "block";
        }, 8000);
      })();
    </script>
  </head>
  <body>
    <!-- Static fallback (only shown if script.js never loads) -->
    <div id="static-fallback" style="display:none;position:fixed;inset:0;z-index:10000;background:linear-gradient(160deg,#d6d2cc,#e2deda);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#1d1b17;align-items:center;justify-content:center;text-align:center;padding:24px;">
      <div style="max-width:420px;background:rgba(255,255,255,.55);border:1px solid rgba(29,27,23,.12);border-radius:16px;padding:36px 28px;box-shadow:0 12px 30px rgba(29,27,23,.18);">
        <img src="logo.svg" alt="Whisper Of Words" style="width:88px;height:88px;display:block;margin:0 auto 12px;" />
        <div style="font-size:17px;font-weight:700;letter-spacing:.08em;">Whisper Of Words</div>
        <p style="font-size:14px;line-height:1.7;margin:14px 0 20px;">မြန်မာစာအုပ်စာအညွှန်းများ — ချိတ်ဆက်မှု ပြန်ကြိုးစားရန် အောက်က ခလုတ်ကို နှိပ်ပါ။</p>
        <a href="." style="display:inline-block;background:#d99b1f;color:#fff;text-decoration:none;font-weight:700;padding:11px 26px;border-radius:10px;font-size:15px;">ပြန်ဖွင့်ရန်</a>
        <div style="margin-top:16px;font-size:13px;">
          <a href="https://t.me/TheBookR" style="color:#1d1b17;">Telegram Channel</a> &nbsp;·&nbsp;
          <a href="https://saroatsin.com" style="color:#1d1b17;">Website</a> &nbsp;·&nbsp;
          <a href="https://github.com/whispermmepub" style="color:#1d1b17;">GitHub</a>
        </div>
      </div>
    </div>

    <!-- Boot screen -->
    <div id="boot" aria-hidden="false">
      <div class="boot-card">
        <img class="boot-logo" src="logo.svg" alt="Whisper Of Words" />
        <div class="boot-title">Whisper Of Words</div>
        <div class="boot-sub">BOOK REVIEW TERMINAL</div>
        <div class="boot-bar"><span id="boot-fill"></span></div>
      </div>
    </div>

    <!-- Main app -->
    <div id="app" class="hidden">
      <div class="statusbar">
        <div class="sb-left" id="sb-date"></div>
        <div class="sb-center sb-logo">
          <img class="sb-avatar" id="sb-avatar" alt="logo" />
          <span class="sb-name" id="sb-name"></span>
        </div>
        <div class="sb-right">
          <span class="sb-time" id="sb-time"></span>
          <span class="sb-signal" title="Signal"><i></i><i></i><i></i><i></i></span>
          <span class="sb-battery">
            <span class="batt"><span class="fill" id="sb-batt-fill"></span></span>
            <span class="batt-txt" id="sb-batt-txt"></span>
          </span>
        </div>
      </div>
      <div class="window">
        <div class="titlebar">
          <div class="dots"><span></span><span></span><span></span></div>
          <div class="win-title">~/reviews — <span id="win-title"></span></div>
        </div>
        <div class="layout">
          <nav id="tabs" aria-label="Sections"></nav>
          <main id="content">
            <section id="tab-home" class="panel active" data-title="home.exe"></section>
            <section id="tab-about" class="panel" data-title="about.exe"></section>
            <section id="tab-links" class="panel" data-title="links.exe"></section>
            <section id="post-view" class="panel" data-title="read.exe"></section>
          </main>
        </div>
      </div>
      <footer id="site-footer"></footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
