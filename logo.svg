<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Whisper Of Words">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7df8a"/>
      <stop offset="25%" stop-color="#e9b93b"/>
      <stop offset="50%" stop-color="#f9e6a0"/>
      <stop offset="75%" stop-color="#d99b1f"/>
      <stop offset="100%" stop-color="#f0cd62"/>
    </linearGradient>
    <radialGradient id="bg" cx="38%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#332e26"/>
      <stop offset="100%" stop-color="#1d1b17"/>
    </radialGradient>
  </defs>

  <!-- badge -->
  <circle cx="256" cy="256" r="232" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="244" fill="none" stroke="url(#gold)" stroke-width="14"/>
  <circle cx="256" cy="256" r="222" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity=".35"/>

  <!-- whisper arcs -->
  <path d="M118 158 Q 94 180 118 202" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
  <path d="M146 168 Q 128 180 146 192" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
  <path d="M394 158 Q 418 180 394 202" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
  <path d="M366 168 Q 384 180 366 192" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>

  <!-- W monogram -->
  <text x="256" y="232" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="150" font-weight="700" fill="url(#gold)">W</text>

  <!-- sparkles -->
  <circle cx="96" cy="272" r="5" fill="url(#gold)" opacity=".85"/>
  <circle cx="416" cy="272" r="5" fill="url(#gold)" opacity=".85"/>
  <circle cx="116" cy="300" r="3" fill="url(#gold)" opacity=".6"/>
  <circle cx="396" cy="300" r="3" fill="url(#gold)" opacity=".6"/>

  <!-- open book -->
  <path d="M256 258 C 208 226 145 228 98 242 L 98 346 C 145 334 208 340 256 376 Z" fill="url(#gold)"/>
  <path d="M256 258 C 304 226 367 228 414 242 L 414 346 C 367 334 304 340 256 376 Z" fill="url(#gold)"/>
  <path d="M256 258 L 256 376" stroke="#1d1b17" stroke-width="4" opacity=".65"/>
  <path d="M256 266 C 210 236 150 238 108 251 L 108 260 C 150 247 210 245 256 275 Z" fill="#f6ecd2" opacity=".9"/>
  <path d="M256 266 C 302 236 362 238 404 251 L 404 260 C 362 247 302 245 256 275 Z" fill="#f6ecd2" opacity=".9"/>

  <!-- page lines -->
  <g stroke="#1d1b17" stroke-width="3" opacity=".28" stroke-linecap="round">
    <path d="M132 300 L 214 300"/>
    <path d="M132 318 L 214 318"/>
    <path d="M132 336 L 204 336"/>
    <path d="M298 300 L 380 300"/>
    <path d="M298 318 L 380 318"/>
    <path d="M298 336 L 370 336"/>
  </g>
</svg>
