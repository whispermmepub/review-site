name: Sync Review Posts & Deploy

on:
  schedule:
    # နာရီတိုင်း အလိုအလျောက် update (UTC)
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "script.js"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: write

jobs:
  sync-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review-site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install beautifulsoup4

      - name: Clone Review repo
        run: git clone --depth 1 https://github.com/whispermmepub/Review.git /tmp/Review

      - name: Build post data
        run: python scripts/build_data.py /tmp/Review review-site

      - name: Commit data changes
        run: |
          git config user.name "whispermmepub"
          git config user.email "whispermmepub@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Auto-sync: update review posts ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push origin main
          else
            echo "No post changes — skipping commit"
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@latest pages deploy review-site --project-name=whisperofwords-review --branch=main --commit-dirty=true
